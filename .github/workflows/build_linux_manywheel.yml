name: Build+Upload Manylinux2014 Python Wheels
on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:
    branches:
      - master


jobs:
  build_linux_wheels:
    name: Build manylinux2014 ${{ matrix.arch }} Wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          submodules: 'recursive'
      - name: Update RCS keywords
        shell: bash
        run: |
          printf '\n[filter "rcs-keywords"]\n\tclean  = .git_filters/rcs-keywords.clean\n\tsmudge = .git_filters/rcs-keywords.smudge %f\n' >> .git/config
          rm -rf src/*.c
          git checkout src/*.c
      - name: Build Wheel Builder Container
        shell: bash
        run: |
          set -x
          cd .github/manylinux2014_wheel_builder
          docker build --build-arg BASE_IMAGE=quay.io/pypa/manylinux2014_${{ matrix.arch }} \
            --tag manylinux2014_wheel_builder --force-rm .
      - name: Build Manylinux2014 Wheels
        shell: bash
        run: |
          docker run -v ${GITHUB_WORKSPACE}:/src/ manylinux2014_wheel_builder
          sudo mv ${GITHUB_WORKSPACE}/pmcxcl/dist/ ${GITHUB_WORKSPACE}/dist/
          ls -l ${GITHUB_WORKSPACE}/dist/
      - name: Save the wheels
        uses: actions/upload-artifact@v4
        with:
          name: pmcxcl-wheels-${{ matrix.arch }}
          path: dist/*.whl

  # the PyPI publish action only runs on x86_64, so the wheels of every architecture are
  # uploaded from one x86_64 job; this also keeps a release from publishing only some of them
  upload_pypi:
    name: Upload Linux Wheels to PyPI
    needs: build_linux_wheels
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'fangq' && github.event_name != 'pull_request' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Collect the wheels
        uses: actions/download-artifact@v4
        with:
          pattern: pmcxcl-wheels-*
          merge-multiple: true
          path: dist/
      - name: List the wheels
        run: ls -l dist/
      - name: Check If the Build Version Exists on PyPI
        id: perform_pypi_upload_check
        shell: bash
        run: |
          ${GITHUB_WORKSPACE}/.github/check-pypi-upload.sh
      - name: Upload packages to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        if: ${{ steps.perform_pypi_upload_check.outputs.perform_pypi_upload == 1 }}
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          verify_metadata: false
          verbose: true
          skip_existing: true
